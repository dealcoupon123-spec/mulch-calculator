<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact – YardCalcTools</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Georgia, 'Times New Roman', serif; background: #f9f7f2; color: #2c2c2c; min-height: 100vh; display: flex; flex-direction: column; }
    header { background: #1a3325; padding: 18px 0; text-align: center; }
    header a { color: #c8d9a0; text-decoration: none; font-size: 22px; letter-spacing: 0.05em; font-weight: bold; }
    main { flex: 1; max-width: 620px; margin: 60px auto; padding: 0 24px; }
    h1 { font-size: 36px; color: #1a3325; margin-bottom: 12px; border-bottom: 2px solid #c8d9a0; padding-bottom: 16px; }
    p { font-size: 16px; line-height: 1.8; color: #555; margin-bottom: 28px; }
    label { display: block; font-size: 14px; color: #1a3325; font-weight: bold; margin-bottom: 6px; }
    input, textarea { width: 100%; padding: 12px 14px; font-size: 15px; font-family: Georgia, serif; border: 1px solid #ccc; border-radius: 4px; background: #fff; margin-bottom: 20px; outline: none; transition: border 0.2s; }
    input:focus, textarea:focus { border-color: #1a3325; }
    textarea { height: 140px; resize: vertical; }
    button { background: #1a3325; color: #c8d9a0; border: none; padding: 13px 36px; font-size: 15px; font-family: Georgia, serif; border-radius: 4px; cursor: pointer; letter-spacing: 0.03em; transition: background 0.2s; }
    button:hover { background: #254d38; }
    footer { background: #1a3325; padding: 18px 0; text-align: center; display: flex; justify-content: center; gap: 40px; margin-top: 60px; }
    footer a { color: #c8d9a0; text-decoration: none; font-size: 15px; letter-spacing: 0.02em; }
    footer a:hover { color: #fff; }
  </style>
</head>
<body>
  <header>
    <a href="/">YardCalcTools</a>
  </header>
  <main>
    <h1>Contact Us</h1>
    <p>Have a question, suggestion, or found a bug? We'd love to hear from you. Fill out the form below and we'll get back to you as soon as possible.</p>
    <form action="https://formspree.io/f/xnjrwjee" method="POST">
      <label for="name">Your Name</label>
      <input type="text" id="name" name="name" placeholder="John Smith" required>
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required>
      <label for="message">Message</label>
      <textarea id="message" name="message" placeholder="Tell us what's on your mind..." required></textarea>
      <button type="submit">Send Message</button>
    </form>
  </main>
  <footer>
    <a href="/about">About</a>
    <a href="/privacy">Privacy Policy</a>
    <a href="/contact">Contact</a>
    <a href="/sitemap.xml">Sitemap</a>
  </footer>
</body>
</html>
